name: Keep Supabase Alive

# Runs a lightweight read against Supabase every 3 days so the free-tier
# project never hits the 7-day inactivity pause. Also runnable manually
# from the Actions tab if you ever want to trigger it by hand.

on:
  schedule:
    - cron: '0 13 */3 * *'   # 13:00 UTC (9:00am ET) every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase positions table
        run: |
          curl -sS -f \
            "https://istmdoxhjyardqxrmvcq.supabase.co/rest/v1/positions?select=id&limit=1" \
            -H "apikey: sb_publishable_7neuuaMH2JC4k3d2hA59lw_UcWlNvSO" \
            -H "Authorization: Bearer sb_publishable_7neuuaMH2JC4k3d2hA59lw_UcWlNvSO"
